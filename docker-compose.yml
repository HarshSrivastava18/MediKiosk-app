version: '3.8'

services:
  api-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=medikiosk_production_secret_key_2026
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
